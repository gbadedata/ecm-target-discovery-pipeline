name: ecm-pipeline
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python core
  - python=3.12
  - pip

  # Data handling
  - pandas>=2.2
  - numpy>=1.26
  - pyarrow>=15.0
  - openpyxl>=3.1

  # Statistics and ML
  - scipy>=1.13
  - scikit-learn>=1.5
  - statsmodels>=0.14
  - lifelines>=0.29

  # Visualisation
  - matplotlib>=3.9
  - seaborn>=0.13
  - plotly>=5.22

  # Validation and testing
  - pydantic>=2.7
  - pytest>=8.2
  - pytest-cov>=5.0

  # Bioinformatics
  - gseapy>=1.1

  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.66
  - structlog>=24.1

  # Linting
  - ruff>=0.5

  # Jupyter/Quarto
  - jupyter>=1.0
  - jupyterlab>=4.2
