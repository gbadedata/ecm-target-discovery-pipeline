name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pandas numpy scipy matplotlib scikit-learn pydantic structlog
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  r-syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Check R script syntax
        run: |
          for f in src/r/*.R; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              Rscript -e "parse('$f')"
            fi
          done
          echo "R syntax check complete"
